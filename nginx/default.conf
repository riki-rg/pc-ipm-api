server {
    listen 80;
    server_name pimpinan.pc-ipm-mayong.web.id _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass pc-ipm-api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
    }

    # === Security hardening ===
    # Blokir dotfiles (.env, .git, dll)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blokir akses langsung ke file sensitif
    location ~* (composer\.(json|lock)|package(-lock)?\.json|\.env.*|artisan|webpack\.mix\.js|vite\.config.*|\.gitignore|\.gitattributes)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blokir akses ke direktori storage/framework & bootstrap dari web
    location ~* ^/(storage/framework|bootstrap/cache) {
        deny all;
        access_log off;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|css|js|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
