; Custom PHP settings for pc-ipm-api (production)
; Upload settings — Filament FileUpload needs bigger limits
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 20
max_execution_time = 120
max_input_time = 120
memory_limit = 256M

; Security hardening
expose_php = Off
allow_url_include = Off
session.cookie_httponly = 1
session.use_strict_mode = 1

; Logging (stderr → docker logs)
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off
display_startup_errors = Off
